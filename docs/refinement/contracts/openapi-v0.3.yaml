        question:
          type: string
          title: Question
        plan:
          additionalProperties: true
          type: object
          title: Plan
        scope_definition:
          additionalProperties: true
          type: object
          title: Scope Definition
        scope_count:
          type: integer
          title: Scope Count
        task_target:
          anyOf:
          - type: string
          - type: 'null'
          title: Task Target
        model_policy:
          additionalProperties: true
          type: object
          title: Model Policy
        estimated_minutes:
          additionalProperties:
            type: integer
          type: object
          title: Estimated Minutes
        impact_summary:
          items:
