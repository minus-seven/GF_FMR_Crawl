          - type: string
            format: date-time
          - type: 'null'
          title: Confirmation Expires At
        job_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Job Id
      type: object
      required:
      - run_id
      - snapshot_id
      - status
      - intent
      - question
      - scope_count
      - requires_confirmation
