            - fund_semiannual
          - type: 'null'
          title: Task Target
        structured_provider:
          anyOf:
          - type: string
            enum:
            - deepseek
            - qwen
            - local
          - type: 'null'
          title: Structured Provider
      type: object
      required:
      - question
      title: AgentPlanRequest
      description: 生成受控计划；参数为自然语言问题、基金范围和可选任务策略。
