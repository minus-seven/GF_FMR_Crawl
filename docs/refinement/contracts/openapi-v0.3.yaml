openapi: 3.1.0
info:
  title: Fund Research Knowledge Agent API
  description: Fund queries, controlled tasks and page-level knowledge search API.
  version: 0.4.0
paths:
  /api/health:
    get:
      tags:
      - health
      summary: Health
      description: 检查 API、数据库和当前快照；参数 request/session 为请求上下文。
      operationId: health_api_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_HealthData_'
  /api/snapshots/current:
    get:
      tags:
      - snapshots
      summary: Current Snapshot
      description: 返回当前发布快照；参数 request/session 为请求上下文。
      operationId: current_snapshot_api_snapshots_current_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_SnapshotData_'
  /api/funds:
    get:
      tags:
      - funds
      summary: Fund List
      description: 分页查询基金；参数为过滤条件、分页和请求上下文。
      operationId: fund_list_api_funds_get
      parameters:
      - name: manager_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Manager Id
      - name: manager
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Manager
      - name: category
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Category
      - name: report_period
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Report Period
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Status
      - name: q
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Q
      - name: secondary
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
          default: []
          title: Secondary
      - name: sort_by
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Sort By
      - name: sort_direction
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Sort Direction
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
          title: Page
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          maximum: 200
          minimum: 1
          default: 50
          title: Page Size
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_FundPageData_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/funds/collections:
    post:
      tags:
      - funds
      summary: Create Fund Collection
      description: 创建绑定会话的临时基金集合；参数 request/session 为请求上下文。
      operationId: create_fund_collection_api_funds_collections_post
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_FundCollectionData_'
    get:
      tags:
      - funds
      summary: List Fund Collections
      description: 列出当前会话仍有效的临时基金集合；参数为会话键和数据库上下文。
      operationId: list_fund_collections_api_funds_collections_get
      parameters:
      - name: session_key
        in: query
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 200
          title: Session Key
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_list_FundCollectionData__'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/funds/{fund_code}/sources/manage:
    get:
      tags:
      - funds
      summary: Manage Sources List
      description: 返回基金全部来源（包含隐藏）；参数 fund_code/request/session 为上下文。
      operationId: manage_sources_list_api_funds__fund_code__sources_manage_get
      parameters:
      - name: fund_code
        in: path
        required: true
        schema:
          type: string
          title: Fund Code
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_SourceManagementData_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - funds
      summary: Manage Sources Action
      description: 执行来源显示、隐藏或删除；删除仅移除基金关联及派生数据。
      operationId: manage_sources_action_api_funds__fund_code__sources_manage_post
      parameters:
      - name: fund_code
        in: path
        required: true
        schema:
          type: string
          title: Fund Code
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_SourceManagementData_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/funds/{fund_code}/metrics:
    get:
      tags:
      - funds
      summary: Fund Metrics
      description: 返回基金最新结构化指标；参数 fund_code/request/session 为请求上下文。
      operationId: fund_metrics_api_funds__fund_code__metrics_get
      parameters:
      - name: fund_code
        in: path
        required: true
        schema:
          type: string
          title: Fund Code
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_MetricListData_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/funds/{fund_code}/supplementary-source:
    post:
      tags:
      - funds
      summary: Create Supplementary Source
      description: 创建单基金补充来源任务；支持 URL 或上传 PDF，并复用三段流水线。
      operationId: create_supplementary_source_api_funds__fund_code__supplementary_source_post
      parameters:
      - name: fund_code
        in: path
        required: true
        schema:
          type: string
          title: Fund Code
      - name: Idempotency-Key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Idempotency-Key
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_SupplementarySourceData_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/funds/{fund_code}:
    get:
      tags:
      - funds
      summary: Fund Detail
      description: 返回基金确定性和补充来源详情；参数 fund_code/request/session。
      operationId: fund_detail_api_funds__fund_code__get
      parameters:
      - name: fund_code
        in: path
        required: true
        schema:
          type: string
          title: Fund Code
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_FundDetailData_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/quality/issues:
    get:
      tags:
      - quality
      summary: Quality Issues
      description: 分页查询当前批次质量问题；参数为过滤和请求上下文。
      operationId: quality_issues_api_quality_issues_get
      parameters:
      - name: severity
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Severity
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Status
      - name: fund_code
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Fund Code
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
          title: Page
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          maximum: 200
          minimum: 1
          default: 50
          title: Page Size
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_QualityPageData_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/quality/issues/{issue_id}/review:
    get:
      tags:
      - quality
      summary: Quality Review Detail
      description: 返回复核工作台所需的基金全量上下文和可编辑记录。
      operationId: quality_review_detail_api_quality_issues__issue_id__review_get
      parameters:
      - name: issue_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Issue Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_QualityReviewData_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    put:
      tags:
      - quality
      summary: Quality Review Update
      description: 保存编辑后的结构化记录，可选择同时关闭质量问题。
      operationId: quality_review_update_api_quality_issues__issue_id__review_put
      parameters:
      - name: issue_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Issue Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QualityReviewUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_QualityReviewActionData_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/quality/issues/{issue_id}/confirm:
    post:
      tags:
      - quality
      summary: Quality Review Confirm
      description: 确认问题已人工核验；只改变质量状态并留下审计记录。
      operationId: quality_review_confirm_api_quality_issues__issue_id__confirm_post
      parameters:
      - name: issue_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Issue Id
      requestBody:
        content:
          application/json:
            schema:
              anyOf:
              - type: object
                additionalProperties: true
              - type: 'null'
              title: Body
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_QualityReviewActionData_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/analytics/perspectives:
    get:
      tags:
      - analytics
      summary: Perspectives
      description: 返回规模图表与投资组合结构；可按基金详情当前选中的来源版本过滤。
      operationId: perspectives_api_analytics_perspectives_get
      parameters:
      - name: scope_fund_codes
        in: query
        required: false
        schema:
          anyOf:
          - type: array
            items:
              type: string
          - type: 'null'
          title: Scope Fund Codes
      - name: manager_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Manager Id
      - name: category
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Category
      - name: period
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Period
      - name: source_document_version_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Source Document Version Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_PerspectiveData_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/chat:
    post:
      tags:
      - chat
      summary: Chat
      description: 执行 SQL 优先问答并返回证据契约；参数 body/request/session 为请求和上下文。
      operationId: chat_api_chat_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_ChatResponseData_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/jobs/master-database/options:
    get:
      tags:
      - jobs
      summary: Master Database Options
      description: 返回综合资料库参考文件候选；参数 request/session 为 API 上下文。
      operationId: master_database_options_api_jobs_master_database_options_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_MasterDatabaseOptionsData_'
  /api/jobs/{job_id}/master-artifact:
    get:
      tags:
      - jobs
      summary: Master Database Artifact
      description: 下载综合资料库任务缓存的最新 xlsx。
      operationId: master_database_artifact_api_jobs__job_id__master_artifact_get
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Job Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/jobs/{job_id}/master-import:
    post:
      tags:
      - jobs
      summary: Import Master Database
      description: 把已完成任务的缓存 xlsx 导入为新的发布批次。
      operationId: import_master_database_api_jobs__job_id__master_import_post
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Job Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_MasterDatabaseImportData_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/jobs/{job_id}/publish:
    post:
      tags:
      - jobs
      summary: Internal Publish
      description: 供本机 Worker 提交已验证 manifest；参数 job_id/body/request/session。
      operationId: internal_publish_api_jobs__job_id__publish_post
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Job Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublishRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_PublishResultData_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/jobs:
    post:
      tags:
      - jobs
      summary: Submit Job
      description: 创建任务并冻结范围；参数 body/request/response/key/session。
      operationId: submit_job_api_jobs_post
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          title: Idempotency-Key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobCreateRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_JobData_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - jobs
      summary: Job List
      description: 分页查询任务；参数 request/status/page/page_size/session。
      operationId: job_list_api_jobs_get
      parameters:
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Status
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
          title: Page
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          maximum: 200
          minimum: 1
          default: 50
          title: Page Size
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_JobPageData_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/jobs/scope-options:
    get:
      tags:
      - jobs
      summary: Scope Options
      description: 返回全量、管理人和资产类别范围选项；参数 request/session。
      operationId: scope_options_api_jobs_scope_options_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_ScopeOptionsData_'
  /api/jobs/{job_id}:
    get:
      tags:
      - jobs
      summary: Job Detail
      description: 查询任务详情；参数 job_id/request/session。
      operationId: job_detail_api_jobs__job_id__get
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Job Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_JobData_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/jobs/{job_id}/cancel:
    post:
      tags:
      - jobs
      summary: Cancel
      description: 请求取消任务；参数 job_id/request/session。
      operationId: cancel_api_jobs__job_id__cancel_post
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Job Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_JobData_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/jobs/{job_id}/retry:
    post:
      tags:
      - jobs
      summary: Retry
      description: 从失败阶段继续任务；参数 job_id/request/session。
      operationId: retry_api_jobs__job_id__retry_post
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Job Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_JobData_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/jobs/{job_id}/funds:
    get:
      tags:
      - jobs
      summary: Job Funds
      description: 查询任务内基金结果和跳过/失败原因；参数 job/filter/page/session。
      operationId: job_funds_api_jobs__job_id__funds_get
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Job Id
      - name: result_status
        in: query
        required: false
        schema:
          anyOf:
          - type: array
            items:
              type: string
          - type: 'null'
          title: Result Status
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
          title: Page
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          maximum: 1000
          minimum: 1
          default: 200
          title: Page Size
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_JobFundScopePageData_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/jobs/{job_id}/issues:
    get:
      tags:
      - jobs
      summary: Job Issues
      description: 查询任务各阶段跳过与失败基金；参数 job_id/request/session。
      operationId: job_issues_api_jobs__job_id__issues_get
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Job Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_JobFundIssuePageData_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/jobs/{job_id}/events:
    get:
      tags:
      - jobs
      summary: Job Events
      description: 以 SSE 推送任务事件；参数 job_id/request/last_event_id。
      operationId: job_events_api_jobs__job_id__events_get
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Job Id
      - name: Last-Event-ID
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Last-Event-Id
