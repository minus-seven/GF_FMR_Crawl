          default: []
          title: Fund Codes
      - name: report_periods
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
            format: date
          default: []
          title: Report Periods
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 50
          minimum: 1
          default: 10
          title: Limit
      - name: snapshot_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Snapshot Id
      - name: query_vector
        in: query
        required: false
        schema:
          type: array
          items:
            type: number
          default: []
          title: Query Vector
      - name: embedding_model
        in: query
        required: false
        schema:
          type: string
          default: BAAI/bge-m3
          title: Embedding Model
      - name: embedding_version
        in: query
        required: false
        schema:
          type: string
          default: v1
          title: Embedding Version
